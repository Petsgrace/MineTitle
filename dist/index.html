  <!-- Service Worker Registration Safe for Native & Browser -->
  <script>
    (function() {
      var isNative = (window.Capacitor !== undefined && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
                     window.location.protocol === 'file:' ||
                     window.location.hostname === 'localhost';

      if ('serviceWorker' in navigator) {
        if (!isNative) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                console.log('[PWA] Service worker registered. Scope:', reg.scope);
              })
              .catch(function(err) {
                console.log('[PWA] Service worker registration skipped:', err);
              });
          });
        } else {
          // If native app, ensure no stale worker or cache intercepts asset requests
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.unregister();
            });
          }).catch(function() {});
          if (window.caches && window.caches.keys) {
            window.caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                window.caches.delete(key);
              });
            }).catch(function() {});
          }
        }
      }
    })();
  </script>
