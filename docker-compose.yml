version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: onestop_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-onestop_lands}
      POSTGRES_USER: ${DB_USER:-lands_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lands_secure_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lands_admin} -d ${DB_NAME:-onestop_lands}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local
